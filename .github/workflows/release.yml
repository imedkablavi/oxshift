name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libsndfile1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/oxshift.spec
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/OxShift-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist OxShift
      - name: Package Windows portable and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/OxShift/* -DestinationPath "release/OxShift-${{ github.ref_name }}-windows-x86_64-portable.zip" -Force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not installed on the runner" }
          & $iscc "/DAppVersion=${{ github.ref_name }}" packaging/windows/oxshift.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Verify, sign and publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Keyless-sign release artifacts
        working-directory: release
        env:
          COSIGN_YES: "true"
        run: |
          for artifact in *.tar.gz *.zip *.exe SHA256SUMS.txt; do
            [ -f "$artifact" ] || continue
            cosign sign-blob "$artifact" --bundle "$artifact.sigstore.json" --yes
          done
      - name: Verify signatures before publishing
        working-directory: release
        run: |
          identity="https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}"
          for artifact in *.tar.gz *.zip *.exe SHA256SUMS.txt; do
            [ -f "$artifact" ] || continue
            cosign verify-blob "$artifact" \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
            release/*.sigstore.json
