[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxshift"
version = "0.3.0a1"
description = "Local-first real-time voice changer, soundboard and voice studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "sounddevice>=0.5,<1",
  "pedalboard>=0.9.24,<1",
  "pynput>=1.7,<2",
]

[project.optional-dependencies]
ai = [
  "onnxruntime>=1.20,<2",
]
dev = [
  "pytest>=8,<9",
]
build = [
  "pyinstaller>=6.10,<7",
]

[project.scripts]
oxshift = "voxshift.__main__:main"

[tool.setuptools.packages.find]
include = ["voxshift*"]
